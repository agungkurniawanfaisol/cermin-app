# CERMIN — local Next.js with hot reload
# Database + Storage: Supabase cloud (not in Compose)
#
#   cp .env.example .env.local   # isi nilai Supabase
#   docker compose up --build
# App: http://localhost:5173

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cermin-web
    ports:
      - "5173:5173"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: "5173"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Prefer app URL inside browser/host
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:5173}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
    volumes:
      # Edit on host → Fast Refresh in container
      - .:/app
      # Keep container node_modules / .next off the host tree
      - cermin_node_modules:/app/node_modules
      - cermin_next:/app/.next
    stdin_open: true
    tty: true

volumes:
  cermin_node_modules:
  cermin_next:
